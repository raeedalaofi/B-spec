<!--
  Green flag: solid, as the regulations have it. The raster this replaces was a
  green *checkered* flag, which is not a thing, and which made "race started"
  and "race finished" the same picture in two hues.

  Solid vs checkered is the silhouette difference that lets the two read apart
  instantly, in greyscale, at HUD size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Green flag">
  <path d="M10 8c14-6 26 6 44 0v28c-18 6-30-6-44 0z" fill="#2fa84f"/>
  <path d="M10 8c14-6 26 6 44 0v28c-18 6-30-6-44 0z" fill="none" stroke="#1c6b32" stroke-width="2"/>
  <rect x="6" y="6" width="4" height="54" rx="2" fill="#5b6472"/>
</svg>
