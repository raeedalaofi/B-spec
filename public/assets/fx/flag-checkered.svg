<!--
  The checkered flag, in black and white.

  The generated raster it replaces was gold and white, and the "green flag"
  beside it was also checkered — so the two most important state signals in the
  game shared a silhouette and differed only in hue. That fails the 20px
  silhouette test and it fails anyone with a colour vision deficiency.

  These are geometric primitives, not illustrations. As SVG they are ~1 KB,
  sharp at any size, and exactly the colour they are supposed to be.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Checkered flag">
  <defs>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f2f4f8"/>
      <rect width="8" height="8" fill="#12151c"/>
      <rect x="8" y="8" width="8" height="8" fill="#12151c"/>
    </pattern>
    <clipPath id="wave">
      <path d="M10 8c14-6 26 6 44 0v28c-18 6-30-6-44 0z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#wave)">
    <rect x="10" y="2" width="48" height="40" fill="url(#chk)"/>
  </g>
  <path d="M10 8c14-6 26 6 44 0v28c-18 6-30-6-44 0z" fill="none" stroke="#12151c" stroke-width="2"/>
  <rect x="6" y="6" width="4" height="54" rx="2" fill="#5b6472"/>
</svg>
